<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Symcon-Icons (Font Awesome) aus der Visualisierung -->
<script src="/icons.js" crossorigin="anonymous"></script>
<style>
    /* Tankstellen-Kachel · MIT © 2026 Armin Frohwerk · Daten: Tankerkönig/MTS-K CC BY 4.0 */
    :root {
        --tk-accent: #22b14c;
        --tk-accent-soft: rgba(34, 177, 76, .14);
        --tk-muted: rgba(127, 127, 127, .95);
        --tk-line: rgba(127, 127, 127, .2);
        --tk-chip: rgba(127, 127, 127, .14);
        --tk-error: #e5484d;
    }
    * { box-sizing: border-box; }
    /* Kachelschema: transparenter Hintergrund, Schrift und Farbe kommen aus der Visualisierung */
    html, body { margin: 0; height: 100%; background: transparent; color: inherit; font-family: inherit; -webkit-font-smoothing: antialiased; }
    body { container-type: size; overflow: hidden; }
    .wrap { height: 100%; display: flex; flex-direction: column; gap: 8px; }

    .fuels { display: flex; gap: 6px; }
    .fuel {
        flex: 1; min-width: 0; border: 0; cursor: pointer; font: inherit; color: inherit;
        background: var(--tk-chip); border-radius: 10px; padding: 6px 4px; text-align: center;
        transition: background .15s, transform .1s; -webkit-tap-highlight-color: transparent;
    }
    .fuel:active { transform: scale(.97); }
    .fuel .k { font-size: 12px; font-weight: 700; letter-spacing: .3px; }
    .fuel .v { font-size: 11px; color: var(--tk-muted); white-space: nowrap; }
    .fuel.on { background: var(--tk-accent); color: #fff; }
    .fuel.on .v { color: rgba(255, 255, 255, .85); }
    .icon-btn { border: 0; background: var(--tk-chip); color: inherit; border-radius: 10px; width: 36px; cursor: pointer; font-size: 14px; flex: 0 0 auto; }
    .icon-btn.spin i { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hero { border-radius: 14px; padding: 10px 12px; background: var(--tk-accent-soft); border: 1px solid rgba(34, 177, 76, .3); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hero .info { min-width: 0; }
    .hero .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--tk-muted); }
    .hero .name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero .addr { font-size: 12px; color: var(--tk-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero .price { font-size: 32px; font-weight: 800; line-height: 1; color: var(--tk-accent); white-space: nowrap; }
    sup { font-size: .55em; vertical-align: .75em; margin-left: 1px; }
    .badge { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--tk-accent); color: #fff; }

    .stats { display: flex; gap: 6px; }
    .stat { flex: 1; background: var(--tk-chip); border-radius: 10px; padding: 5px 8px; min-width: 0; }
    .stat .v { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .stat .l { font-size: 10px; color: var(--tk-muted); text-transform: uppercase; letter-spacing: .4px; }

    .list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .item { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--tk-line); }
    .item:first-child { border-top: 0; }
    .item .rk { font-size: 12px; font-weight: 700; color: var(--tk-muted); text-align: center; }
    .item .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .s { font-size: 11px; color: var(--tk-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .p { font-size: 15px; font-weight: 700; text-align: right; white-space: nowrap; }
    .item .d { font-size: 11px; color: var(--tk-muted); text-align: right; }
    .item.best .p { color: var(--tk-accent); }
    .item.closed { opacity: .45; }

    .msg { padding: 8px 10px; border-radius: 10px; font-size: 13px; background: var(--tk-chip); }
    .msg.err { background: rgba(229, 72, 77, .14); color: var(--tk-error); }
    .foot { font-size: 10px; color: var(--tk-muted); display: flex; justify-content: space-between; gap: 6px; }

    /* Kleine Kacheln: nur das Wesentliche */
    @container (max-height: 300px) { .list { display: none; } }
    @container (max-height: 220px) { .stats, .foot { display: none; } }
    @container (max-height: 150px) { .hero .addr, .fuel .v { display: none; } .hero .price { font-size: 26px; } }
    @container (max-width: 260px) { .hero { flex-direction: column; align-items: flex-start; } .icon-btn { display: none; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="fuels" id="fuels"></div>
    <div id="content"></div>
    <div class="list" id="list"></div>
    <div class="foot"><span id="updated"></span><span>Tankerkönig · CC BY 4.0</span></div>
</div>

<script>
    let state = null;
    let selected = null;

    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

    // Preis in Tankstellen-Optik: 1,75⁹ € – als DOM, nicht als HTML-String
    function priceNode(p, cls) {
        const span = el('span', cls);
        if (p === null || p === undefined || isNaN(p)) { span.textContent = '–'; return span; }
        const s = Number(p).toFixed(3);
        span.append(s.slice(0, -1).replace('.', ','), el('sup', '', s.slice(-1)), ' €');
        return span;
    }
    const km = (d) => Number(d).toFixed(1).replace('.', ',') + ' km';

    function renderFuels() {
        const box = $('fuels');
        box.replaceChildren();
        (state.fuels || []).forEach((f) => {
            const b = el('button', 'fuel' + (f.index === selected ? ' on' : ''));
            b.type = 'button';
            b.append(el('div', 'k', f.short));
            const v = el('div', 'v'); v.append(priceNode(f.min)); b.append(v);
            b.addEventListener('click', () => {
                if (f.index === selected) return;
                selected = f.index;     // sofort lokal umschalten – keine Wartezeit
                render();
                requestAction('FuelType', f.index); // Auswahl im Modul speichern
            });
            box.append(b);
        });
        const r = el('button', 'icon-btn');
        r.type = 'button'; r.title = 'Aktualisieren'; r.id = 'refresh';
        const icon = el('i', 'fa-light fa-arrows-rotate');
        r.append(icon);
        // Rückfall, falls die Symcon-Icons nicht geladen sind
        requestAnimationFrame(() => {
            const c = getComputedStyle(icon, '::before').content;
            if (!c || c === 'none' || c === 'normal' || c === '""') icon.textContent = '⟳';
        });
        r.addEventListener('click', () => { r.classList.add('spin'); requestAction('Refresh', true); });
        box.append(r);
    }

    function render() {
        if (!state) return;
        renderFuels();
        const content = $('content');
        const list = $('list');
        content.replaceChildren();
        list.replaceChildren();

        if (state.error) content.append(el('div', 'msg err', state.error));

        const f = (state.fuels || []).find((x) => x.index === selected);
        const c = f && f.cheapest;
        if (c) {
            const hero = el('div', 'hero');
            const info = el('div', 'info');
            info.append(el('div', 'lbl', 'Günstigste · ' + f.label + ' · ' + state.radius + ' km'),
                el('div', 'name', c.name), el('div', 'addr', c.address + ' · ' + km(c.distance)));
            if (state.threshold !== null && state.threshold !== undefined && c.price <= state.threshold) {
                const b = el('span', 'badge'); b.append('unter ', priceNode(state.threshold)); info.append(b);
            }
            hero.append(info, priceNode(c.price, 'price'));
            content.append(hero);

            const stats = el('div', 'stats');
            [['Ø Preis', priceNode(f.avg)], ['Teuerste', priceNode(f.max)], ['Stationen', document.createTextNode(String(f.count))]].forEach(([l, v]) => {
                const s = el('div', 'stat'); const val = el('div', 'v'); val.append(v); s.append(val, el('div', 'l', l)); stats.append(s);
            });
            content.append(stats);

            (f.stations || []).forEach((s, i) => {
                const row = el('div', 'item' + (s.id === c.id ? ' best' : '') + (s.isOpen ? '' : ' closed'));
                const mid = el('div'); mid.style.minWidth = '0';
                mid.append(el('div', 'n', s.name), el('div', 's', s.address));
                const right = el('div'); right.append(priceNode(s.price, 'p'), el('div', 'd', km(s.distance)));
                right.firstChild.style.display = 'block';
                row.append(el('div', 'rk', String(i + 1)), mid, right);
                list.append(row);
            });
        } else if (!state.error) {
            content.append(el('div', 'msg', state.updated ? 'Keine passenden Tankstellen gefunden.' : 'Noch keine Daten …'));
        }

        $('updated').textContent = state.updated
            ? 'Stand ' + new Date(state.updated * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
            : '';
    }

    // Wird von Symcon bei jeder Aktualisierung aufgerufen (String) bzw. initial (Objekt)
    function handleMessage(data) {
        try { state = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
        if (!state) return;
        selected = state.selected;
        render();
    }
</script>
</body>
</html>
